<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美元 / 人民币 (USD / CNY)</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #f7f1e8;
            --card-bg: #faf7f1;
            --text-color: #2f2a24;
            --muted-text: #756d63;
            --border-color: #b8afa3;
            --accent-border: #8c8275;
            --danger-color: #9b2c2c;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: Georgia, "Times New Roman", serif;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--accent-border);
            padding-bottom: 10px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .current {
            font-size: 42px;
        }

        .current span {
            font-size: 18px;
            color: var(--muted-text);
        }

        /* Trend Status Card */
        .analysis-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid #36a2eb;
            padding: 16px 20px;
            margin-bottom: 25px;
            border-radius: 2px;
        }

        .analysis-card h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 6px 0;
            color: var(--muted-text);
        }

        .status-text {
            font-size: 18px;
            font-weight: bold;
        }

        .chart-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .info {
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.7;
            color: #625b53;
            display: flex;
            justify-content: space-between;
        }

        .error {
            color: var(--danger-color);
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>美元 / 人民币 (USD / CNY)</h1>

    <div class="header-section">
        <div class="current">
            <span>1 美元 = </span>
            <span id="currentRate">正在加载...</span>
            <span> 人民币</span>
        </div>
    </div>

    <!-- 清晰的趋势摘要 -->
    <div class="analysis-card">
        <h2>趋势检测</h2>
        <div class="status-text" id="trendStatus">正在分析趋势...</div>
    </div>

    <div class="chart-container">
        <canvas id="rateChart"></canvas>
    </div>

    <div class="info">
        <div>数据来源：Frankfurter API</div>
        <div id="dateRange"></div>
        <div id="observationCount"></div>
    </div>

    <div id="error" class="error"></div>

</div>

<script>
/* ============================================================
   配置与工具函数
   ============================================================ */

const START_DATE = "2025-11-03";

function getPreviousUTCDate() {
    const now = new Date();
    const yesterday = new Date(
        Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - 1)
    );
    return yesterday.toISOString().slice(0, 10);
}

/* ============================================================
   统计引擎：贯序曼-肯德尔检验 (Sequential Mann-Kendall Test)
   ============================================================ */

function sequentialMannKendall(data) {
    const n = data.length;
    const u = new Array(n).fill(0);
    const uPrime = new Array(n).fill(0);

    function computeProgressiveU(series) {
        const len = series.length;
        const result = new Array(len).fill(0);
        let t = 0;
        
        for (let i = 1; i < len; i++) {
            let r_i = 0;
            for (let j = 0; j < i; j++) {
                if (series[i] > series[j]) r_i++;
            }
            t += r_i;

            const E = (i * (i + 1)) / 4;
            const Var = (i * (i + 1) * (2 * i + 5)) / 72;

            result[i] = Var > 0 ? (t - E) / Math.sqrt(Var) : 0;
        }
        return result;
    }

    const forwardU = computeProgressiveU(data);
    const backwardU = computeProgressiveU([...data].reverse());

    for (let i = 0; i < n; i++) {
        u[i] = forwardU[i];
        uPrime[i] = -backwardU[n - 1 - i];
    }

    const threshold = 1.96;
    let changePointIndex = null;

    for (let i = 1; i < n; i++) {
        const prevDiff = u[i - 1] - uPrime[i - 1];
        const currDiff = u[i] - uPrime[i];

        if (Math.sign(prevDiff) !== Math.sign(currDiff)) {
            if (Math.abs(u[i]) > threshold || Math.abs(uPrime[i]) > threshold) {
                changePointIndex = i;
            }
        }
    }

    return { u, u_prime: uPrime, changePointIndex };
}

function evaluateTrendStatus(seqMkResult) {
    const { u, changePointIndex } = seqMkResult;
    const lastIndex = u.length - 1;
    const latestU = u[lastIndex];
    const threshold = 1.96;

    if (latestU < -threshold) {
        if (changePointIndex !== null && changePointIndex > lastIndex - 30) {
            return "触底 / 反转：检测到趋势破位。";
        }
        return "持续中：下跌趋势仍然有效。";
    } else if (Math.abs(latestU) <= threshold) {
        return changePointIndex !== null 
            ? "已触底 / 已反转：当前无活跃的下跌趋势。"
            : "盘整 / 无趋势：下跌动能减弱。";
    } else {
        return "已反转：序列现已呈现上升趋势。";
    }
}

/* ============================================================
   数据获取与应用初始化
   ============================================================ */

async function fetchExchangeData() {
    const endDate = getPreviousUTCDate();
    const url = `https://api.frankfurter.dev/v2/rates?base=USD&quotes=CNY&from=${START_DATE}&to=${endDate}`;

    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    if (!Array.isArray(data) || data.length === 0) {
        throw new Error("未返回汇率数据。");
    }

    data.sort((a, b) => a.date.localeCompare(b.date));
    return data;
}

function renderUI(data, statusText) {
    const dates = data.map(x => x.date);
    const rates = data.map(x => x.rate);
    const latestRate = rates[rates.length - 1];

    // 1. 文本摘要更新
    document.getElementById("currentRate").textContent = latestRate.toFixed(4);
    document.getElementById("dateRange").textContent = `数据区间：${dates[0]} → ${dates[dates.length - 1]}`;
    document.getElementById("observationCount").textContent = `观测样本数：${data.length}`;
    document.getElementById("trendStatus").textContent = statusText;

    // 2. 简洁的单线图表
    new Chart(document.getElementById("rateChart"), {
        type: "line",
        data: {
            labels: dates,
            datasets: [
                {
                    label: "美元/人民币汇率",
                    data: rates,
                    borderColor: "#2f2a24",
                    borderWidth: 1.5,
                    pointRadius: 0,
                    pointHoverRadius: 4, 
                    pointHitRadius: 10,   
                    tension: 0.1,
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            events: ['mousemove', 'mouseout', 'click', 'touchstart', 'touchmove'],
            interaction: { 
                intersect: false, 
                mode: "index",
                axis: "x" 
            },
            hover: {
                mode: "index",
                intersect: false
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return ` ${context.parsed.y.toFixed(4)}`;
                        }
                    }
                }
            },
            scales: {
                x: { ticks: { maxTicksLimit: 12 } },
                y: {
                    title: { display: true, text: "每美元兑人民币" }
                }
            }
        }
    });
}

async function init() {
    try {
        const data = await fetchExchangeData();
        const rates = data.map(x => x.rate);

        const mkResult = sequentialMannKendall(rates);
        const statusText = evaluateTrendStatus(mkResult);

        renderUI(data, statusText);
    } catch (error) {
        console.error(error);
        document.getElementById("error").textContent = `无法加载汇率数据：${error.message}`;
    }
}

init();
</script>
</body>
</html>
