<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD / CNY</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #f7f1e8;
            --card-bg: #faf7f1;
            --text-color: #2f2a24;
            --muted-text: #756d63;
            --border-color: #b8afa3;
            --accent-border: #8c8275;
            --danger-color: #9b2c2c;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: Georgia, "Times New Roman", serif;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--accent-border);
            padding-bottom: 10px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .current {
            font-size: 42px;
        }

        .current span {
            font-size: 18px;
            color: var(--muted-text);
        }

        /* Trend Status Card */
        .analysis-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid #36a2eb;
            padding: 16px 20px;
            margin-bottom: 25px;
            border-radius: 2px;
        }

        .analysis-card h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 6px 0;
            color: var(--muted-text);
        }

        .status-text {
            font-size: 18px;
            font-weight: bold;
        }

        .chart-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .info {
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.7;
            color: #625b53;
            display: flex;
            justify-content: space-between;
        }

        .error {
            color: var(--danger-color);
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>USD / CNY</h1>

    <div class="header-section">
        <div class="current">
            <span>1 USD = </span>
            <span id="currentRate">Loading...</span>
            <span> CNY</span>
        </div>
    </div>

    <!-- Clear Trend Summary -->
    <div class="analysis-card">
        <h2>Trend Detection</h2>
        <div class="status-text" id="trendStatus">Analyzing trend...</div>
    </div>

    <div class="chart-container">
        <canvas id="rateChart"></canvas>
    </div>

    <div class="info">
        <div>Data source: Frankfurter API</div>
        <div id="dateRange"></div>
        <div id="observationCount"></div>
    </div>

    <div id="error" class="error"></div>

</div>

<script>
/* ============================================================
   CONFIG & UTILITIES
   ============================================================ */

const START_DATE = "2025-11-03";

function getPreviousUTCDate() {
    const now = new Date();
    const yesterday = new Date(
        Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - 1)
    );
    return yesterday.toISOString().slice(0, 10);
}

/* ============================================================
   STATISTICAL ENGINE: Sequential Mann-Kendall Test
   ============================================================ */

function sequentialMannKendall(data) {
    const n = data.length;
    const u = new Array(n).fill(0);
    const uPrime = new Array(n).fill(0);

    function computeProgressiveU(series) {
        const len = series.length;
        const result = new Array(len).fill(0);
        let t = 0;
        
        for (let i = 1; i < len; i++) {
            let r_i = 0;
            for (let j = 0; j < i; j++) {
                if (series[i] > series[j]) r_i++;
            }
            t += r_i;

            const E = (i * (i + 1)) / 4;
            const Var = (i * (i + 1) * (2 * i + 5)) / 72;

            result[i] = Var > 0 ? (t - E) / Math.sqrt(Var) : 0;
        }
        return result;
    }

    const forwardU = computeProgressiveU(data);
    const backwardU = computeProgressiveU([...data].reverse());

    for (let i = 0; i < n; i++) {
        u[i] = forwardU[i];
        uPrime[i] = -backwardU[n - 1 - i];
    }

    const threshold = 1.96;
    let changePointIndex = null;

    for (let i = 1; i < n; i++) {
        const prevDiff = u[i - 1] - uPrime[i - 1];
        const currDiff = u[i] - uPrime[i];

        if (Math.sign(prevDiff) !== Math.sign(currDiff)) {
            if (Math.abs(u[i]) > threshold || Math.abs(uPrime[i]) > threshold) {
                changePointIndex = i;
            }
        }
    }

    return { u, u_prime: uPrime, changePointIndex };
}

function evaluateTrendStatus(seqMkResult) {
    const { u, changePointIndex } = seqMkResult;
    const lastIndex = u.length - 1;
    const latestU = u[lastIndex];
    const threshold = 1.96;

    if (latestU < -threshold) {
        if (changePointIndex !== null && changePointIndex > lastIndex - 30) {
            return "BOTTOMING / REVERSING: Trend break detected.";
        }
        return "CONTINUING: Decreasing trend remains active.";
    } else if (Math.abs(latestU) <= threshold) {
        return changePointIndex !== null 
            ? "BOTTOMED / REVERSED: No active decreasing trend."
            : "FLAT / NO TREND: Decreasing momentum lost.";
    } else {
        return "REVERSED: Series now shows an increasing trend.";
    }
}

/* ============================================================
   DATA FETCH & APP INIT
   ============================================================ */

async function fetchExchangeData() {
    const endDate = getPreviousUTCDate();
    const url = `https://api.frankfurter.dev/v2/rates?base=USD&quotes=CNY&from=${START_DATE}&to=${endDate}`;

    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    if (!Array.isArray(data) || data.length === 0) {
        throw new Error("No exchange-rate data returned.");
    }

    data.sort((a, b) => a.date.localeCompare(b.date));
    return data;
}

function renderUI(data, statusText) {
    const dates = data.map(x => x.date);
    const rates = data.map(x => x.rate);
    const latestRate = rates[rates.length - 1];

    // 1. Text Summary Updates
    document.getElementById("currentRate").textContent = latestRate.toFixed(4);
    document.getElementById("dateRange").textContent = `Data: ${dates[0]} → ${dates[dates.length - 1]}`;
    document.getElementById("observationCount").textContent = `Observations: ${data.length}`;
    document.getElementById("trendStatus").textContent = statusText;

    // 2. Clean Single Line Chart
    new Chart(document.getElementById("rateChart"), {
        type: "line",
        data: {
            labels: dates,
            datasets: [
                {
                    label: "USD/CNY Rate",
                    data: rates,
                    borderColor: "#2f2a24",
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.1,
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            interaction: { intersect: false, mode: "index" },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return ` ${context.parsed.y.toFixed(4)}`;
                        }
                    }
                }
            },
            scales: {
                x: { ticks: { maxTicksLimit: 12 } },
                y: {
                    title: { display: true, text: "CNY per USD" }
                }
            }
        }
    });
}

async function init() {
    try {
        const data = await fetchExchangeData();
        const rates = data.map(x => x.rate);

        const mkResult = sequentialMannKendall(rates);
        const statusText = evaluateTrendStatus(mkResult);

        renderUI(data, statusText);
    } catch (error) {
        console.error(error);
        document.getElementById("error").textContent = `Unable to load exchange-rate data: ${error.message}`;
    }
}

init();
</script>
</body>
</html>
