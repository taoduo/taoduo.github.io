<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Weight Tracking</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #F7F1E8;
      font-family: "STKaiti", "Songti SC", serif;
    }
    #plot {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="plot"></div>

<script>
// ==========================================
// CONFIGURATION & GLOBAL STATE
// ==========================================
const API_URL = "https://api.jsonbin.io/v3/b/6a31a1b9da38895dfecbc217";
const MASTER_KEY = "$2a$10$OBxmU7a6eu38e/WyoVdhRerNucod.s2WtPl2QPG3J2g5Hca4UZLtW";
const START_DATE_STR = "2025-12-16";
const Y_MIN = 70;

let yData = [];

// ==========================================
// DSP & SIGNAL PROCESSING
// ==========================================

function interpolateNulls(signal) {
  const result = [...signal];
  for (let i = 0; i < result.length; i++) {
    if (result[i] === null) {
      let prev = i - 1;
      while (prev >= 0 && result[prev] === null) prev--;
      
      let next = i + 1;
      while (next < result.length && result[next] === null) next++;

      if (prev >= 0 && next < result.length) {
        const factor = (i - prev) / (next - prev);
        result[i] = result[prev] + factor * (result[next] - result[prev]);
      } else if (prev >= 0) {
        result[i] = result[prev];
      } else if (next < result.length) {
        result[i] = result[next];
      } else {
        result[i] = 0;
      }
    }
  }
  return result;
}

function mirrorExtend(signal) {
  const N = signal.length;
  const extended = new Array(2 * N);
  for (let i = 0; i < N; i++) {
    extended[i] = signal[i];
    extended[2 * N - 1 - i] = signal[i];
  }
  return extended;
}

function dft(signal) {
  const N = signal.length;
  const frequencies = [];
  for (let k = 0; k < N; k++) {
    let real = 0;
    let imag = 0;
    for (let n = 0; n < N; n++) {
      const angle = (2 * Math.PI * k * n) / N;
      real += signal[n] * Math.cos(angle);
      imag -= signal[n] * Math.sin(angle);
    }
    frequencies.push({ real, imag });
  }
  return frequencies;
}

function idft(frequencies) {
  const N = frequencies.length;
  const reconstructed = [];
  for (let n = 0; n < N; n++) {
    let sumReal = 0;
    for (let k = 0; k < N; k++) {
      const angle = (2 * Math.PI * k * n) / N;
      sumReal += frequencies[k].real * Math.cos(angle) - frequencies[k].imag * Math.sin(angle);
    }
    reconstructed.push(sumReal / N);
  }
  return reconstructed;
}

/**
 * Filter: zero out bins where k > totalLength / 7
 */
function filterCutoffLengthBySeven(spectrum) {
  const N2 = spectrum.length;
  const cutoffBins = Math.floor(N2 / 30);

  return spectrum.map((bin, k) => {
    if (k <= cutoffBins || k >= N2 - cutoffBins) {
      return bin;
    }
    return { real: 0, imag: 0 };
  });
}

function reconstructMirroredTimeSeries(signal) {
  const N = signal.length;
  const cleaned = interpolateNulls(signal);
  const mirroredSignal = mirrorExtend(cleaned);

  const spectrum = dft(mirroredSignal);
  const filteredSpectrum = filterCutoffLengthBySeven(spectrum);
  
  const reconstructed2N = idft(filteredSpectrum);
  const reconstructed = reconstructed2N.slice(0, N);

  const currentMin = Math.min(...reconstructed);
  const currentMax = Math.max(...reconstructed);
  const currentRange = currentMax - currentMin;
  const targetRange = Math.max(...cleaned) - Math.min(...cleaned);

  if (currentRange > 0) {
    const scale = targetRange / currentRange;
    const mid = (currentMax + currentMin) / 2;
    return reconstructed.map(val => (val - mid) * scale + mid);
  }

  return reconstructed;
}

// ==========================================
// RENDERING & HELPERS
// ==========================================

function generateDates(startDateStr, n) {
  const [year, month, day] = startDateStr.split("-").map(Number);
  return Array.from({ length: n }, (_, i) => {
    const d = new Date(Date.UTC(year, month - 1, day + i));
    return [
      d.getUTCFullYear(),
      String(d.getUTCMonth() + 1).padStart(2, "0"),
      String(d.getUTCDate()).padStart(2, "0")
    ].join("-");
  });
}

function getMilestones(dates, y) {
  let prevFloor = Math.floor(y.find(v => v !== null));
  const mx = [], my = [], labels = [];

  for (let i = 0; i < y.length; i++) {
    const val = y[i];
    if (val !== null) {
      const currFloor = Math.floor(val);
      if (currFloor < prevFloor) {
        mx.push(dates[i]);
        my.push(val);
        labels.push(String(currFloor));
        prevFloor = currFloor;
      }
    }
  }
  return { mx, my, labels };
}

function formatCN(dateStr) {
  const [y, m, d] = dateStr.split("-");
  return `${y}年${parseInt(m)}月${parseInt(d)}日`;
}

function renderPlot(y) {
  const dates = generateDates(START_DATE_STR, y.length);
  const smoothedSignal = reconstructMirroredTimeSeries(y).map(v => Number(v.toFixed(2)));
  const { mx, my, labels } = getMilestones(dates, y);

  const LINE_COLOR = "#C96A2B";
  const BG_COLOR = "#F7F1E8";
  const FRAME_COLOR = "#3B2F2F";
  const TICK_COLOR = "#A89F94";

  const weightTrace = {
    x: dates, 
    y: y,
    mode: "lines",
    connectgaps: true,
    line: { width: 2, color: LINE_COLOR },
    name: "实际",
    // Single-line formatting inside the unified hover card
    hovertemplate: "%{y:.2f} kg<extra>实际</extra>"
  };

  const smoothTrace = {
    x: dates,
    y: smoothedSignal,
    mode: "lines",
    connectgaps: true,
    line: { width: 2, color: "#FFD700" },
    name: "平滑",
    hovertemplate: "%{y:.2f} kg<extra>平滑</extra>"
  };

  const milestoneTrace = {
    x: mx, 
    y: my,
    mode: "markers+text",
    text: labels,
    textposition: "bottom center",
    marker: { size: 6, color: "white", line: { width: 2, color: LINE_COLOR } },
    textfont: { size: 16, color: "darkgoldenrod" },
    hoverinfo: "skip",
    name: "里程碑"
  };

  const yMax = Math.max(...y.filter(v => v !== null)) + 1;
  const rangeSpan = yMax - Y_MIN;
  const dtick = Math.max(1, Math.round(rangeSpan / 8));

  const startStr = dates[0];
  const endStr = dates[dates.length - 1];
  const title = `总减重: ${(y[0] - y[y.length - 1]).toFixed(2)} kg (${formatCN(startStr)} - ${formatCN(endStr)})`;

  const layout = {
    title: title,
    paper_bgcolor: BG_COLOR,
    plot_bgcolor: BG_COLOR,
    showlegend: false,
    
    // Combines all values into a single tooltip box with a full vertical line
    hovermode: "x unified",

    margin: { l: 60, r: 60, t: 60, b: 60 },
    font: { family: "STKaiti, Songti SC, serif", size: 14, color: FRAME_COLOR },
    xaxis: {
      type: "date",
      range: [
        new Date(new Date(dates[0]).getTime() - 3 * 86400000),
        new Date(new Date(dates[dates.length - 1]).getTime() + 3 * 86400000)
      ],
      tickvals: mx,
      ticktext: mx.map(d => {
        const [, m, day] = d.split("-");
        return `${parseInt(m)}月${parseInt(day)}日`;
      }),
      tickangle: -45,
      showline: true,
      linecolor: FRAME_COLOR,
      mirror: true,
      gridcolor: "rgba(0,0,0,0.05)",
      tickfont: { color: TICK_COLOR }
    },
    yaxis: {
      range: [Y_MIN - 1, yMax],
      tick0: Y_MIN,
      dtick: dtick,
      showline: true,
      linecolor: FRAME_COLOR,
      mirror: true,
      gridcolor: "rgba(0,0,0,0.05)",
      tickfont: { color: TICK_COLOR }
    }
  };

  Plotly.newPlot("plot", [weightTrace, smoothTrace, milestoneTrace], layout, { responsive: true });
}

// ==========================================
// API & NETWORK CALLS
// ==========================================

async function fetchWeightData() {
  try {
    const res = await fetch(API_URL, {
      headers: { "X-Master-Key": MASTER_KEY }
    });
    const data = await res.json();
    yData = data.record.reverse();
    renderPlot(yData);
  } catch (err) {
    console.error("Error loading weight data:", err);
  }
}

async function updateWeightData(newDataArray) {
  try {
    const payload = JSON.stringify([...newDataArray].reverse());
    await fetch(API_URL, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": MASTER_KEY
      },
      body: payload
    });
    location.reload();
  } catch (err) {
    console.error("Error updating weight data:", err);
  }
}

function handleNumber(n) {
  yData.push(n);
  updateWeightData(yData);
}

function deleteLatest() {
  if (!yData || yData.length === 0) {
    alert("没有数据可删除。");
    return;
  }
  if (!confirm(`确定删除最新记录（${yData[yData.length - 1]} kg）吗？`)) {
    return;
  }
  yData.pop();
  updateWeightData(yData);
}

// ==========================================
// UI & KEYBOARD CONTROLS
// ==========================================

const popup = document.createElement("div");
Object.assign(popup.style, {
  position: "fixed", top: "0", left: "0", width: "100vw", height: "100vh",
  background: "rgba(0,0,0,0.5)", display: "none", alignItems: "center", justifyContent: "center"
});

popup.innerHTML = `
  <div style="background:white;padding:20px;border-radius:10px;">
    <input id="numInput" type="number" step="any" placeholder="Enter number" />
    <button id="submitBtn">Submit</button>
  </div>
`;
document.body.appendChild(popup);

const numInput = popup.querySelector("#numInput");
const submitBtn = popup.querySelector("#submitBtn");

function showPopup() {
  popup.style.display = "flex";
  numInput.value = "";
  numInput.focus();
}

function hidePopup() {
  popup.style.display = "none";
}

function submit() {
  const val = parseFloat(numInput.value);
  if (isNaN(val)) return;
  hidePopup();
  handleNumber(val === 0 ? null : val);
}

submitBtn.onclick = submit;
numInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") submit();
});

document.addEventListener("keydown", (e) => {
  if (document.activeElement === numInput) return;

  const key = e.key.toLowerCase();
  if (key === "q") {
    showPopup();
  } else if (key === "p") {
    deleteLatest();
  } else if (key === "g") {
    window.location.href = "gen.html";
  } else if (key === "r") {
    window.location.href = "usd-cny-rate.html";
  }
});

// Initial load
fetchWeightData();
</script>
</body>
</html>
