<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duo's Website</title>
<style>
body {
    font-family: Georgia, "Times New Roman", serif;
    max-width: 1100px;
    margin: 50px auto;
    padding: 0 30px;
    background: #faf8f3;
    color: #2b2b2b;
}

h1 {
    text-align: center;
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: 1px;
    margin-bottom: 40px;
}

#meal {
    text-align: center;
    margin-bottom: 45px;
    min-height: 80px;
}

#meal button {
    margin: 8px;
    padding: 14px 28px;
    font-family: inherit;
    font-size: 1rem;
    border-radius: 999px;
    border: 1px solid #cfc4b4;
    background: #fffdf8;
    color: #3b352d;
    cursor: pointer;
    transition: all 0.2s ease;
}

#meal button:hover {
    background: #3b352d;
    color: #fffdf8;
    transform: translateY(-2px);
}

#date {
    text-align: center;
    font-size: 0.95rem;
    color: #777;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(0,0,0,0.45);
}

.modal-content {
    background: #fffdf8;
    max-width: 650px;
    margin: 8vh auto;
    padding: 35px;
    border-radius: 14px;
    border: 1px solid #ddd5c8;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
    position: relative;
}

.close {
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 30px;
    cursor: pointer;
    color: #888;
}

.close:hover {
    color: black;
}

#chores {
    display: none;
    text-align: center;
    margin-bottom: 30px;
    padding: 18px;
    background: #fffdf8;
    border: 1px solid #e2dacd;
    border-radius: 12px;
}

.reminder-list {
    list-style: none;
    padding: 0;
    margin: 12px 0 0;
}

.reminder-list li {
    margin: 8px 0;
}
</style>
</head>
<body>
<div id="date"></div>

<h1>Daily Curated Choices</h1>

<div id="meal">
    <button id="generate-sweets">🍰 Sweet?</button>
    <button id="pant-button">👖 Pants?</button>
</div>

<div id="chores"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span id="close-modal" class="close">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
// Format: [intervalInWeeks, "startDateString"]
const choreSchedule = {
    // Mondays
    "Wash two trays, dish rack": [4, "2026-10-5"],
    // Tuesdays
    "Laundry: bathmat": [4, "2026-10-6"],
    "Laundry: duvet": [2, "2026-10-6"],
    // Wednesdays
    // Thursdays
    "Change bath towel": [1, "2026-10-1"],
    // Fridays
    "Check mail": [1, "2026-10-2"],
    "Vacuuming and mopping": [1, "2026-10-2"],
    // Saturdays
    "Face exfoliating": [1, "2026-10-3"],
    "Change shower filter head": [12, "2026-10-3"],
    "Laundry: hamper, sleepwear, towels": [1, "2026-10-3"],
    // Sundays
    "Wipe down surfaces": [4, "2026-10-11"],
    "Laundry: pants": [3, "2026-10-4"],
    "Laundry: sheet, pillow cases": [1, "2026-10-4"]
};

const pantsRef = new Date("2026-07-21");
const pants = ["Green", "Beige", "Blue"];

function getChoreList() {
    const today = new Date();
    // Start of today in local time
    const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    return Object.entries(choreSchedule)
        .filter(([_, [interval, startDateStr]]) => {
            // Safely parse "YYYY-MM-DD" as local midnight across all mobile browsers
            const [year, month, day] = startDateStr.split("-").map(Number);
            const startMidnight = new Date(year, month - 1, day);

            const diffInTime = todayMidnight - startMidnight;
            const diffInDays = Math.round(diffInTime / (1000 * 60 * 60 * 24));

            return diffInDays >= 0 && diffInDays % (interval * 7) === 0;
        })
        .map(([item]) => item);
}

function getPantToday() {
    const today = new Date();

    // Monday = 1 ... Friday = 5
    const day = today.getDay();

    if (day < 1 || day > 5) return null;

    const weeksElapsed = Math.floor(
        (today - pantsRef) / (1000 * 60 * 60 * 24 * 7)
    );

    const rotation = weeksElapsed % 3;

    // Rotate A,B,C together
    const weekly = [
        pants[rotation],
        pants[(rotation + 1) % 3],
        pants[(rotation + 2) % 3]
    ];

    // Pattern: A B C A B
    const pattern = [0, 1, 2, 0, 1];

    return weekly[pattern[day - 1]];
}

function showReminder(id, title, emoji, items) {
    const div = document.getElementById(id);

    if (items.length === 0) {
        div.style.display = "none";
        return;
    }

    div.innerHTML = `
        <h2>${emoji} ${title}</h2>
        <ul class="reminder-list">
            ${items.map(item => `<li>${item}</li>`).join("")}
        </ul>
    `;

    div.style.display = "block";
}

showReminder(
    "chores",
    "Today's Chores",
    "🧹",
    getChoreList()
);

function showModal(html) {
    document.getElementById("modal-body").innerHTML = html;
    document.getElementById("modal").style.display = "block";
}

function showResult(text) {
    showModal(`
        <p style="text-align:center;font-size:1.4rem;">
            ${text}
        </p>
    `);
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

document.getElementById("close-modal").onclick = closeModal;

window.onclick = function(e) {
    if (e.target === document.getElementById("modal")) {
        closeModal();
    }
};

document.getElementById("generate-sweets").onclick = () => {
    const haveSweets = Math.floor(Math.random() * 7) === 0;

    showResult(
        haveSweets ? "Yes!" : "No"
    );
};

document.getElementById("pant-button").onclick = () => {
    const pant = getPantToday();

    showResult(
        pant ?? "It's the weekend!"
    );
};

function updateDate() {
    const today = new Date();

    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    document.getElementById("date").textContent =
        today.toLocaleDateString("en-US", options);
}

updateDate();
</script>
</body>
</html>
