<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choices and Reminders</title>
<style>
body {
    font-family: Georgia, "Times New Roman", serif;
    max-width: 1100px;
    margin: 50px auto;
    padding: 0 30px;
    background: #faf8f3;
    color: #2b2b2b;
}

h1 {
    text-align: center;
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: 1px;
    margin-bottom: 40px;
}

#meal {
    text-align: center;
    margin-bottom: 45px;
    min-height: 80px;
}

#meal h2 {
    font-size: 1.8rem;
    font-weight: 400;
    padding: 25px;
    border: 1px solid #ddd5c8;
    background: #fffdf8;
    border-radius: 12px;
    display: inline-block;
    box-shadow: 0 4px 15px rgba(0,0,0,0.04);
}

#meal button {
    margin: 8px;
    padding: 14px 28px;
    font-family: inherit;
    font-size: 1rem;
    border-radius: 999px;
    border: 1px solid #cfc4b4;
    background: #fffdf8;
    color: #3b352d;
    cursor: pointer;
    transition: all 0.2s ease;
}

#meal button:hover {
    background: #3b352d;
    color: #fffdf8;
    transform: translateY(-2px);
}

#date {
    text-align: center;
    font-size: 0.95rem;
    color: #777;
    letter-spacing: 1px;
    margin-bottom: 12px;
}
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(0,0,0,0.45);
}

.modal-content {
    background: #fffdf8;
    max-width: 650px;
    margin: 8vh auto;
    padding: 35px;
    border-radius: 14px;
    border: 1px solid #ddd5c8;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
    position: relative;
}

.close {
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 30px;
    cursor: pointer;
    color: #888;
}

.close:hover {
    color: black;
}

#modal-body h2 {
    margin-top: 0;
    text-align: center;
    font-weight: 400;
}

.favorites-list {
    list-style: none;
    padding: 0;
    margin: 20px 0 0;
}

.favorites-list li {
    padding: 12px 0;
    border-bottom: 1px solid #e8e1d6;
    font-size: 1.15rem;
}

.favorites-list li:last-child {
    border-bottom: none;
}
#laundry,
#chores {
    display: none;
    text-align: center;
    margin-bottom: 30px;
    padding: 18px;
    background: #fffdf8;
    border: 1px solid #e2dacd;
    border-radius: 12px;
}

.reminder-list {
    list-style: none;
    padding: 0;
    margin: 12px 0 0;
}

.reminder-list li {
    margin: 8px 0;
}
</style>
</head>
<body>
<div id="date"></div>

<h1>Daily Curated Choices</h1>

<div id="meal">
    <button id="generate-lunch">🥗 Restaurant?</button>
    <button id="generate-coffee">☕ Coffee?</button>
    <button id="generate-sweets">🍰 Sweet?</button>
    <button id="generate-favorite">⭐ Golden Triangle</button>
</div>

<div id="laundry"></div>
<div id="chores"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span id="close-modal" class="close">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>
<script>
const referenceWeek = new Date("2026-07-21");
const laundryDay = 2;
const laundrySchedule = {
    "Hamper": 1,
    "Sheets": 1,
    "Bathmat": 4,
    "Sleepwear": 1,
    "Bath Towel": 1
};

const choreSchedule = {
    "Check Mail": [5, 1],
    "Change Bath Towel": [4, 1],
    "Wash Water Pitchers": [3, 1]
};

function getWeeksElapsed() {
    const today = new Date();

    return Math.floor(
        (today - referenceWeek) /
        (1000 * 60 * 60 * 24 * 7)
    );
}

function getLaundryList() {
    const today = new Date();

    if (today.getDay() !== laundryDay) return [];

    const weeks = getWeeksElapsed();

    return Object.entries(laundrySchedule)
        .filter(([_, interval]) => weeks % interval === 0)
        .map(([item]) => item);
}

function getChoreList() {
    const today = new Date();
    const weeks = getWeeksElapsed();

    return Object.entries(choreSchedule)
        .filter(([_, [day, interval]]) =>
            today.getDay() === day &&
            weeks % interval === 0
        )
        .map(([item]) => item);
}

function showReminder(id, title, emoji, items) {
    const div = document.getElementById(id);

    if (items.length === 0) {
        div.style.display = "none";
        return;
    }

    div.innerHTML = `
        <h2>${emoji} ${title}</h2>
        <ul class="reminder-list">
            ${items.map(item => `<li>${item}</li>`).join("")}
        </ul>
    `;

    div.style.display = "block";
}

showReminder(
    "laundry",
    "Laundry Today",
    "🧺",
    getLaundryList()
);

showReminder(
    "chores",
    "Today's Chores",
    "🧹",
    getChoreList()
);

const inventory = {
    lunch: [
        "Erewhon",
        "Urbane Cafe",
        "Urban Plates",
        "Mendocino Farms",
        "Cava",
        "Panda Express"
    ],
    coffee: [
        "Intelligentsia",
        "Copa Vida",
        "Blue Bottle",
        "Klatch",
        "Fika Fika",
        "Three Fields",
        "Kaldi",
        "Euclid Coffee",
        "Republic Coffee"
    ]
};
const favorites = [
    "Matu",
    "Loukà",
    "Very Thai",
    "Novikov",
    "Azur",
    "Khinkali",
    "Avra",
    "Bacari",
    "Nua",
    "Hideaway",
    "La ong",
    "Mr. Chow"
];

function randomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}
function showResult(text, emoji) {
    showModal(`
        <h2>${emoji}</h2>
        <p style="text-align:center;font-size:1.4rem;">
            ${text}
        </p>
    `);
}

function showModal(html) {
    document.getElementById("modal-body").innerHTML = html;
    document.getElementById("modal").style.display = "block";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

document.getElementById("close-modal").onclick = closeModal;

window.onclick = function(e) {
    if (e.target === document.getElementById("modal")) {
        closeModal();
    }
};
document.getElementById("generate-lunch").onclick = () => {
    showResult(randomItem(inventory.lunch), "🥗");
};

document.getElementById("generate-coffee").onclick = () => {
    showResult(randomItem(inventory.coffee), "☕");
};

document.getElementById("generate-sweets").onclick = () => {
    const haveSweets = Math.floor(Math.random() * 7) === 0;

    showResult(
        haveSweets ? "Yes!" : "No",
        haveSweets ? "🍰" : "🚫"
    );
};
document.getElementById("generate-favorite").onclick = () => {
    showResult(randomItem(favorites), "⭐");
};

function updateDate() {
    const today = new Date();

    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    document.getElementById("date").textContent =
        today.toLocaleDateString("en-US", options);
}

updateDate();
</script>

</body>
</html>
