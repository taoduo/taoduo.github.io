<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<div id="date"></div>
<h1>Daily Curated Choices</h1>
<div id="meal">
    <button id="generate-lunch">🥗 Restaurant?</button>
    <button id="generate-coffee">☕ Coffee?</button>
    <button id="generate-sweets">🍰 Sweet   ?</button>
</div>

<br>
<title>Food Inventory</title>
<style>
body {
    font-family: Georgia, "Times New Roman", serif;
    max-width: 1100px;
    margin: 50px auto;
    padding: 0 30px;
    background: #faf8f3;
    color: #2b2b2b;
}

h1 {
    text-align: center;
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: 1px;
    margin-bottom: 40px;
}

#meal {
    text-align: center;
    margin-bottom: 45px;
    min-height: 80px;
}

#meal h2 {
    font-size: 1.8rem;
    font-weight: 400;
    padding: 25px;
    border: 1px solid #ddd5c8;
    background: #fffdf8;
    border-radius: 12px;
    display: inline-block;
    box-shadow: 0 4px 15px rgba(0,0,0,0.04);
}

#meal button {
    margin: 8px;
    padding: 14px 28px;
    font-family: inherit;
    font-size: 1rem;
    border-radius: 999px;
    border: 1px solid #cfc4b4;
    background: #fffdf8;
    color: #3b352d;
    cursor: pointer;
    transition: all 0.2s ease;
}

#meal button:hover {
    background: #3b352d;
    color: #fffdf8;
    transform: translateY(-2px);
}











#date {
    text-align: center;
    font-size: 0.95rem;
    color: #777;
    letter-spacing: 1px;
    margin-bottom: 12px;
}
</style>
</head>
<body>

<script>
const inventory = {
    lunch: [
        "Erewhon",
        "Urbane Cafe",
        "Urban Plates",
        "Mendocino Farms",
        "Cava",
        "Panda Express"
    ],
    coffee: [
        "Intelligentsia",
        "Copa Vida",
        "Blue Bottle",
        "Klatch",
        "Fika Fika",
        "Coffee JPG",
        "Three Fields",
        "Kaldi",
        "Euclid Coffee"
    ]
};

function randomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}
function showResult(text, emoji) {
    document.getElementById("meal").innerHTML = `<h2>${emoji} ${text}</h2>`;
}


document.getElementById("generate-lunch").onclick = () => {
    showResult(randomItem(inventory.lunch), "🥗");
};

document.getElementById("generate-coffee").onclick = () => {
    showResult(randomItem(inventory.coffee), "☕");
};

document.getElementById("generate-sweets").onclick = () => {
    const haveSweets = Math.floor(Math.random() * 7) === 0;

    showResult(
        haveSweets ? "Yes!" : "No",
        haveSweets ? "🍰" : "🚫"
    );
};
function updateDate() {
    const today = new Date();

    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    document.getElementById("date").textContent =
        today.toLocaleDateString("en-US", options);
}

updateDate();
</script>

</body>
</html>
