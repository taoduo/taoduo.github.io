<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<div id="meal">
    <button id="generate-breakfast">🍳 Generate Breakfast</button>
    <button id="generate-lunch">🥗 Generate Lunch</button>
</div>

<br>
<title>Food Inventory</title>
<style>
body {
    font-family: sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    line-height: 1.6;
}

#inventory {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
}

.column h2 {
    margin-top: 0;
    border-bottom: 1px solid #ddd;
    padding-bottom: 4px;
    text-transform: capitalize;
}

ul {
    padding-left: 20px;
    margin: 0;
}

li {
    margin: 4px 0;
}
#meal {
    text-align: center;
    margin-bottom: 30px;
}

#meal button {
    margin: 0 8px;
}

#generate {
    font-size: 1.2rem;
    font-weight: 600;
    padding: 14px 32px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ffb347, #ff7e5f);
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255, 126, 95, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

#generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(255, 126, 95, 0.4);
}

#generate:active {
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(255, 126, 95, 0.3);
}
</style>
</head>
<body>

<h1>Food Inventory</h1>

<div id="inventory">Loading...</div>

<script>
const BIN_ID = "6a533501f5f4af5e29833513";
const API_KEY = "$2a$10$OBxmU7a6eu38e/WyoVdhRerNucod.s2WtPl2QPG3J2g5Hca4UZLtW";

let inventory = {};

async function loadInventory() {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: {
            "X-Master-Key": API_KEY
        }
    });

    inventory = (await res.json()).record;

    const container = document.getElementById("inventory");
    container.innerHTML = "";

    for (const [category, items] of Object.entries(inventory)) {
        const column = document.createElement("div");
        column.className = "column";

        const h2 = document.createElement("h2");
        h2.textContent = category;

        const ul = document.createElement("ul");

        items.forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            ul.appendChild(li);
        });

        column.appendChild(h2);
        column.appendChild(ul);
        container.appendChild(column);
    }
}

function randomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}
document.getElementById("generate-breakfast").onclick = () => {
    const breakfast = [
        randomItem(inventory.protein),
        randomItem(inventory.fruit),
        randomItem(inventory.carbs),
        randomItem(inventory.fat)
    ].join(" + ");

    document.getElementById("meal").innerHTML = `<h2>🍳 ${breakfast}</h2>`;
};

document.getElementById("generate-lunch").onclick = () => {
    const lunch = randomItem(inventory.lunch);

    document.getElementById("meal").innerHTML = `<h2>🥗 ${lunch}</h2>`;
};


loadInventory().catch(err => {
    document.getElementById("inventory").textContent = "Failed to load inventory.";
    console.error(err);
});
</script>

</body>
</html>
